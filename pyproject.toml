[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI: The Agent That Builds Agents (Zero-Cost Stack)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "pypdf>=4.2.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "rank_bm25>=0.2.2",
  "rapidfuzz>=3.9.0",
  "typer>=0.12.0",
]

[project.scripts]
forge = "forgeai.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["forgeai*"]
